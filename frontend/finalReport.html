<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Final Report — PrepMate AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles/finalReport.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="dashboard.html">PrepMate AI</a>
      </div>
    </nav>

    <main class="container py-5">
      <h4>Final Report</h4>
      <div class="card">
        <div class="card-body">
          <h5>Summary</h5>
          <div id="finalReportSummary">No report generated yet</div>
          <hr>
          <h5>Detailed Scores</h5>
          <ul class="list-group mb-3" id="finalReportDetails">
            <li class="list-group-item">Technical: <span id="finalTechnical">--</span></li>
            <li class="list-group-item">Communication: <span id="finalCommunication">--</span></li>
            <li class="list-group-item">Confidence: <span id="finalConfidence">--</span></li>
            <li class="list-group-item">Overall: <span id="finalOverall">--</span></li>
          </ul>
          <div class="d-flex gap-2">
            <button id="downloadReportBtn" class="btn btn-primary">Download Report</button>
            <a id="backToDashboard" class="btn btn-outline-secondary" href="dashboard.html">Back</a>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/config.js"></script>
    <script src="scripts/api.js"></script>
    <script src="scripts/finalReport.js"></script>
  </body>
</html>
